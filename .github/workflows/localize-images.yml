name: Localize Markdown Images

on:
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04     # 明确指定，避免自动迁移带来的意外
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # 已支持 Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6  # 已支持 Node 24
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download images and update Markdown
        run: python scripts/localize_images.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ *.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: localize external images to repo [skip ci]"
            git push
          fi
